<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau HTML</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f7fb, #e8f0ff);
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        h3 {
            color: #1d4ed8;
            text-align: center;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        img {
            display: block;
            margin: 0 auto 25px auto;
            border-radius: 12px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
            border: 3px solid #dbeafe;
            width: 500px;
        }

        table {
            width: 70%;
            margin: 0 auto;
            border-collapse: collapse;
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border: 1px solid #d1d5db;
        }

        thead th {
            background: #2563eb;
            color: white;
            font-weight: bold;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:nth-child(odd) {
            background: #ffffff;
        }

        tbody tr:hover {
            background: #dbeafe;
            transition: 0.2s ease;
        }
    </style>
</head>
